name: Import DPN Language Source
on:
  push:
    paths:
      - "dpn-source.tar.gz"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Safely extract DPN source
        run: |
          set -euo pipefail
          test -f dpn-source.tar.gz
          tar -tzf dpn-source.tar.gz | while IFS= read -r f; do
            case "$f" in /*|../*|*/../*|*/..) echo "unsafe archive path: $f"; exit 1;; esac
          done
          tar -xzf dpn-source.tar.gz
          test -f Cargo.toml
          test -f src/lib.rs
          test -f src/main.rs
          # Workflow files are installed separately using the GitHub connector
          # because the Actions token lacks workflow-management scope.
          rm -f .github/workflows/rust.yml .github/workflows/editor.yml
          rm dpn-source.tar.gz
      - name: Commit source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import DPN Language v0.8.0 interpreter, tests and editor"
          git push
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/vscode_static.js
