name: Import DPN Language Source
on:
  push:
    paths:
      - "dpn-source.tar.gz"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract verified source package
        run: |
          set -euo pipefail
          test -f dpn-source.tar.gz
          tar -tzf dpn-source.tar.gz | while IFS= read -r f; do
            case "$f" in /*|../*|*/../*|*/..) echo "unsafe archive path: $f"; exit 1;; esac
          done
          tar -xzf dpn-source.tar.gz
          test -f Cargo.toml
          test -f src/lib.rs
          test -f src/main.rs
          rm dpn-source.tar.gz
          rm .github/workflows/initial-import.yml
      - name: Commit extracted source to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import DPN Language v0.8.0 source and editor tooling"
          git push
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust compile and test
        run: |
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/vscode_static.js
